name: Publicar acompanhamento no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - index.html
      - src/**
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - vite.config.ts
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Habilitar pnpm
        run: corepack enable
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Compilar aplicação
        run: pnpm build
      - name: Adicionar painel de evolução
        run: |
          mkdir -p dist/status
          cp docs/index.html dist/status/index.html
          cp docs/status.json dist/status/status.json
          cp docs/evolution-plan.md dist/status/evolution-plan.md
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
